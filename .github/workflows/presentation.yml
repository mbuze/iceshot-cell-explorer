name: Check published presentation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/presentation.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Exercise the web controls and the browser notebook
        shell: python
        run: |
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          url = "https://mbuze.github.io/iceshot-cell-explorer/"
          from time import sleep
          from urllib.request import urlopen
          from urllib.error import URLError
          from os import environ
          # A push can start this check while Pages is still serving the previous notebook.
          expected = Path("notebook/index.html").read_bytes()
          for attempt in range(36):
              try:
                  with urlopen(url+"notebook/?build="+environ["GITHUB_SHA"]+"&try="+str(attempt), timeout=10) as response:
                      if response.read() == expected: break
              except URLError:
                  pass
              sleep(5)
          else:
              raise RuntimeError("Published notebook has not reached the tested revision")
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.on("pageerror", lambda e: print("Browser error:", e, flush=True))
              page.on("requestfailed", lambda r: print("Request failed:", r.url, r.failure, flush=True))
              page.goto(url+"?build="+environ["GITHUB_SHA"])
              try:
                  frame = page.frame_locator('iframe[title="Interactive tissue experiment"]')
                  frame.locator('.cell[data-id="0"]').wait_for(timeout=150000)
                  frame.get_by_label("Branched",exact=True).check()
                  frame.locator("#play:enabled").wait_for()
                  frame.get_by_label("Rounded",exact=True).check()
                  frame.locator("#play:enabled").wait_for()
                  assert frame.locator("#strength").is_disabled()
                  frame.locator(".cell[data-id='0']").click()
                  assert frame.locator("#tracked").input_value() == "0"
                  frame.get_by_label("Track a cell").select_option("9")
                  frame.get_by_label("Starting centre").uncheck()
                  assert frame.locator("[data-start]").count() == 0
                  frame.get_by_label("Starting centre").check()
                  frame.locator("[data-start]").click()
                  assert frame.locator("#frame").input_value() == "0"
                  frame.locator("#frame").focus()
                  page.keyboard.press("End")
                  assert frame.locator("#distance").inner_text() == "1.20 cell widths"
                  frame.get_by_label("Stay put").check()
                  assert frame.locator("#distance").inner_text() == "0.03 cell widths"
                  frame.get_by_label("Starting borders").check()
                  frame.get_by_label("Full sheet").check()
                  assert frame.locator("#field").get_attribute("viewBox") == "0 0 700 700"
                  frame.get_by_label("Tissue",exact=True).select_option("aligned")
                  frame.locator("#play:enabled").wait_for()
                  frame.get_by_label("Spindle",exact=True).check()
                  frame.locator("#play:enabled").wait_for()
                  frame.get_by_label("Shape change").select_option("50")
                  frame.locator("#play:enabled").wait_for()
                  frame.get_by_role("button",name="Play",exact=True).click()
                  frame.get_by_role("button",name="Pause").click()
                  assert frame.locator(".cell").count() == 49
                  page.set_viewport_size({"width":390,"height":844})
                  frame.get_by_label("Tissue",exact=True).select_option("mosaic")
                  frame.locator("#play:enabled").wait_for()
                  assert frame.locator("main").evaluate("e => e.scrollWidth <= window.innerWidth")
              finally:
                  print(page.locator("body").inner_text()[:2000], flush=True)
                  page.screenshot(path="presentation.png")
                  browser.close()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: presentation
          path: presentation.png
