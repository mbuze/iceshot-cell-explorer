name: Check protrusion playground
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['protrusions.py', 'notebook/protrusions.html', 'public/protrusions/**', '.github/workflows/protrusions.yml']
permissions:
  contents: read
jobs:
  playground:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Inspect matched attempts and recalculate the tissue
        shell: python
        run: |
          import json, os, re, time
          from pathlib import Path
          from urllib.error import URLError
          from urllib.request import urlopen
          from playwright.sync_api import sync_playwright, expect

          root = "https://mbuze.github.io/iceshot-cell-explorer/"
          assets = ["protrusions/index.html", "notebook/protrusions.html", "public/protrusions/index.html",
                    "public/protrusions/playground.mjs", "public/protrusions/model.mjs",
                    "public/press/model.mjs", "public/protrusions/mixed.json"]
          for attempt in range(40):
              try:
                  for name in assets:
                      query = f'?revision={os.environ["GITHUB_SHA"]}&n={attempt}'
                      with urlopen(root+name+query,timeout=8) as res:
                          if res.read() != Path(name).read_bytes():
                              break
                  else:
                      break
              except URLError:
                  pass
              time.sleep(4)
          else:
              raise RuntimeError("Pages has not served the requested revision")

          open_run = json.loads(Path("public/protrusions/open.json").read_text())
          mixed_run = json.loads(Path("public/protrusions/mixed.json").read_text())
          last_step = len(open_run["frames"])-1
          assert last_step == len(mixed_run["frames"])-1 == 64
          assert all("hostFactor" not in f for f in mixed_run["frames"])
          open_events = open_run["events"]
          mixed_events = mixed_run["events"]
          proposal = ("id", "start", "life", "angle", "length", "bend")
          assert [[p[k] for k in proposal] for p in open_events] == [[p[k] for k in proposal] for p in mixed_events]
          trial = next((a for a,b in zip(open_events,mixed_events)
                        if a["caught"] is not None and b["far"] and b["caught"] is None
                        and b["start"]+b["life"]<=last_step), None)
          assert trial is not None
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width":1440,"height":1020},reduced_motion="reduce")
              errors = []
              page.on("pageerror",lambda e: errors.append(str(e)))
              # Simulate a browser where worker construction succeeds but no reply arrives.
              page.add_init_script("""if (location.pathname.includes('/public/protrusions/')) {
                  window.Worker = class { postMessage() {} terminate() {} };
              }""")
              # Emulate a browser whose unversioned assets can no longer be used.
              stale = re.compile(r"/public/(?:protrusions/(?:playground|model|raster|worker|open|mixed)|press/(?:render|model))\.(?:mjs|json)$")
              page.route(stale,lambda route: route.abort())
              page.goto(root+"protrusions/?revision="+os.environ["GITHUB_SHA"])
              f = page.frame_locator('iframe[title="Protrusion experiment"]')
              try:
                  expect(f.locator("#status")).to_have_text("Opening runs solved with ICeShOT.",timeout=150000)
                  for canvas in ("#open", "#mixed"):
                      coloured = f.locator(canvas).evaluate("""c => {
                          const rgba = c.getContext("2d").getImageData(0,0,c.width,c.height).data;
                          let amber = 0;
                          for (let i=0; i<rgba.length; i+=4)
                              if (rgba[i]>125 && rgba[i]>1.15*rgba[i+1] && rgba[i+3]>240) amber++;
                          return amber;
                      }""")
                      assert coloured > 300, f"{canvas} did not paint the pigment cell"
                  f.locator("#event").select_option(str(trial["id"]))
                  f.locator("#inspect-result").click()
                  expect(f.locator("#open-outcome")).to_contain_text("Body reached the earlier tip")
                  expect(f.locator("#mixed-outcome")).to_contain_text("Retracted before the body arrived")
                  f.locator("#event").select_option("")
                  f.locator("#restart").click()
                  f.locator("#play").click()
                  expect(f.locator("#step")).not_to_have_text(f"0 / {last_step}")
                  f.locator("#play").click()
                  f.locator("#fill").focus()
                  page.keyboard.press("Home")
                  expect(f.locator("#status")).to_have_text("Both views updated.",timeout=60000)
                  expect(f.locator("#mixed-occupancy")).to_contain_text("0 neighbours")
                  f.locator("#restart").click()
                  assert f.locator("#open").evaluate("c=>c.toDataURL()") == f.locator("#mixed").evaluate("c=>c.toDataURL()")
                  f.locator("#allTypes").click()
                  expect(f.locator("#status")).to_have_text("Both views updated.",timeout=60000)
                  expect(f.locator("#allTypes")).to_have_text("Use opening mixture")
                  expect(f.locator(".type-list button[aria-pressed=true]")).to_have_count(10)
                  f.locator("#edit summary").click()
                  f.locator("#editType").select_option("1")
                  expect(f.locator("#typeNote")).to_contain_text("Ribbon cells outlined")
                  before_edit = f.locator("#mixed").evaluate("c=>c.toDataURL()")
                  f.locator("#outline").select_option("round")
                  expect(f.locator("#status")).to_have_text("Both views updated.",timeout=8000)
                  assert f.locator("#mixed").evaluate("c=>c.toDataURL()") != before_edit
                  f.locator("#editType").select_option("2")
                  expect(f.locator("#outline")).to_have_value("fork")
                  f.locator("#editType").select_option("1")
                  expect(f.locator("#outline")).to_have_value("round")
                  f.locator("#fill").focus()
                  started = time.perf_counter()
                  page.keyboard.press("End")
                  expect(f.locator("#status")).to_have_text("Both views updated.",timeout=8000)
                  print(f"Densest ten-type render updated in {time.perf_counter()-started:.2f} seconds")
                  f.locator("#life").focus()
                  page.keyboard.press("Home")
                  expect(f.locator("#status")).to_have_text("Both views updated.",timeout=60000)
                  expect(f.locator("#event")).not_to_be_disabled()
                  # Replace the requested density once the old solve has started.
                  f.locator("#fill").evaluate("""el => {
                      const status = document.getElementById('status');
                      const change = value => {
                          el.value = value;
                          el.dispatchEvent(new Event('input', {bubbles: true}));
                      };
                      const watch = new MutationObserver(() => {
                          if (status.textContent.includes('calculating step')) {
                              watch.disconnect();
                              change('0');
                          }
                      });
                      watch.observe(status, {childList: true, subtree: true});
                      change('88');
                  }""")
                  expect(f.locator("#fill")).to_have_value("0",timeout=8000)
                  expect(f.locator("#status")).to_have_text("Both views updated.",timeout=8000)
                  expect(f.locator("#mixed-occupancy")).to_contain_text("0 neighbours")
                  f.locator("#reset").click()
                  expect(f.locator("#status")).to_have_text("Opening runs solved with ICeShOT.",timeout=30000)
                  original = f.locator("#mixed-occupancy").inner_text()
                  f.locator("#editType").select_option("4")
                  expect(f.locator("#typeNote")).to_contain_text("outside the mixture")
                  f.locator("#outline").select_option("split")
                  expect(f.locator("#status")).to_have_text("Opening runs solved with ICeShOT.")
                  expect(f.locator("#mixed-occupancy")).to_have_text(original)
                  expect(f.get_by_role("button",name="Fan",exact=True)).to_have_attribute("aria-pressed","false")
                  f.locator("#editType").select_option("0")
                  f.locator("#editType").select_option("4")
                  expect(f.locator("#outline")).to_have_value("split")
                  page.set_viewport_size({"width":390,"height":844})
                  assert f.locator("main").evaluate("el=>el.scrollWidth<=innerWidth")
                  assert not errors, errors
              finally:
                  page.screenshot(path="protrusions.png",full_page=True)
                  browser.close()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protrusions-preview
          path: protrusions.png
