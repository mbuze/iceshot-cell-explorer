name: Check squeeze playground
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['squeeze.py', 'notebook/squeeze.html', 'public/press/**', '.github/workflows/press.yml']
permissions:
  contents: read
jobs:
  chamber:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Solve and replay on the published page
        shell: python
        run: |
          import os, re, time
          from pathlib import Path
          from urllib.error import URLError
          from urllib.request import urlopen
          from playwright.sync_api import sync_playwright, expect
          root = "https://mbuze.github.io/iceshot-cell-explorer/"
          assets = ["notebook/squeeze.html", "public/press/index.html", "public/press/reach.mjs", "public/press/model.mjs", "public/press/reach-native.json"]
          for attempt in range(40):
              try:
                  for name in assets:
                      with urlopen(root+name+"?revision="+os.environ["GITHUB_SHA"]+"&n="+str(attempt),timeout=8) as res:
                          if res.read() != Path(name).read_bytes():
                              break
                  else:
                      break
              except URLError:
                  pass
              time.sleep(4)
          else:
              raise RuntimeError("Pages has not served the requested revision")
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width":1440,"height":1000},reduced_motion="reduce")
              errors = []
              page.on("pageerror",lambda e: errors.append(str(e)))
              page.goto(root+"squeeze/")
              f = page.frame_locator('iframe[title="Cell shape playground"]')
              try:
                  expect(f.locator("#result")).to_contain_text("Touching 4 cells here, 1 in the control",timeout=150000)
                  initial = f.locator("#tissue").evaluate("c=>c.toDataURL()")
                  f.locator("#reach").focus()
                  page.keyboard.press("Home")
                  expect(f.locator("#result")).to_contain_text("Span 1.00×")
                  assert initial != f.locator("#tissue").evaluate("c=>c.toDataURL()")
                  f.get_by_role("button",name="Fan",exact=True).click()
                  page.keyboard.press("Tab")
                  f.locator("#reach").focus()
                  page.keyboard.press("End")
                  expect(f.locator("#tissue")).to_have_attribute("data-solved", re.compile('"reach":100.*"shape":"fan"'))
                  f.locator("#round").click()
                  expect(f.locator("#round")).to_have_attribute("aria-pressed","true")
                  f.locator("#current").click()
                  f.locator("#cell").select_option("7")
                  f.locator("#stretch").focus()
                  page.keyboard.press("End")
                  expect(f.locator("#tissue")).to_have_attribute("data-solved", re.compile('"stretch":2.8'))
                  f.locator("#press").focus()
                  page.keyboard.press("End")
                  expect(f.locator("#tissue")).to_have_attribute("data-solved", re.compile('"press":95'))
                  page.set_viewport_size({"width":390,"height":840})
                  assert f.locator("main").evaluate("el => el.scrollWidth <= window.innerWidth")
                  f.locator("#reset").click()
                  f.locator("#cell").select_option("21")
                  page.set_viewport_size({"width":1440,"height":1000})
                  page.screenshot(path="reach-preview.png",full_page=True)
                  f.get_by_role("link",name="Open the ten-type squeeze-and-release experiment").click()
                  f=page
                  expect(f.locator("#phase")).to_contain_text("Hold",timeout=30000)
                  f.locator("#frame").focus()
                  page.keyboard.press("End")
                  expect(f.locator("#lost")).to_have_text("2")
                  expect(f.locator("#gained")).to_have_text("20")
                  f.get_by_role("button",name="Gentle",exact=True).click()
                  expect(f.locator("#runInfo")).to_contain_text("6.2% maximum narrowing")
                  f.locator("#frame").focus()
                  page.keyboard.press("End")
                  expect(f.locator("#gained")).to_have_text("2")
                  f.locator("#compare").check()
                  expect(f.locator("#oldValue")).to_contain_text("2 lost, 20 new")
                  f.locator("#links").check()
                  f.locator("#all").click()
                  f.get_by_role("button",name="Edit Coral",exact=True).click()
                  expect(f.locator("#population")).to_have_text("3 of 30 cells")
                  f.locator("#resistance").focus()
                  page.keyboard.press("Home")
                  f.get_by_role("button",name="Run same packing",exact=True).click()
                  expect(f.locator("#runInfo")).to_contain_text("Browser OT solve",timeout=30000)
                  expect(f.locator("#shapeStat")).to_contain_text("Coral cells")
                  f.locator("#frame").focus()
                  page.keyboard.press("End")
                  frame_before=f.locator("#frame").input_value()
                  f.locator("#armStyle").select_option("fan")
                  expect(f.locator("#status")).to_have_text("",timeout=30000)
                  assert f.locator("#frame").input_value()==frame_before
                  f.locator("#play").click()
                  expect(f.locator("#play")).to_have_text("Pause")
                  f.locator("#play").click()
                  f.locator("#rewind").click()
                  expect(f.locator("#lost")).to_have_text("0")
                  f.locator("#new").click()
                  expect(f.locator("#runInfo")).not_to_contain_text("Packing 17 ·",timeout=30000)
                  page.set_viewport_size({"width":390,"height":840})
                  assert f.locator("main").evaluate("el => el.scrollWidth <= window.innerWidth")
                  assert not errors, errors
              finally:
                  page.screenshot(path="press-preview.png",full_page=True)
                  browser.close()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: press-preview
          path: |
            press-preview.png
            reach-preview.png
