<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How far can a cell reach?</title><link rel="stylesheet" href="reach.css"></head>
<body><main><header id="solo" hidden><h1>How far can a cell reach?</h1></header>
<div class="bench">
<section class="field">
<div class="bar"><div class="switch" aria-label="Tissue view"><button id="current" aria-pressed="true">Shaped cells</button><button id="round" aria-pressed="false">Round control</button></div><button id="reset">Reset</button></div>
<canvas id="tissue" width="840" height="548" aria-label="Cell territories between the walls. Select a gold cell to inspect it."></canvas>
<div class="caption"><label><input id="highlight" type="checkbox" checked> Outline new neighbours</label><span id="state" role="status">Loading tissue…</span></div>
</section>
<section class="controls" aria-label="Shape and tissue controls">
<h2>Gold cells</h2><div class="shapes" role="group" aria-label="Preferred shape"><button data-shape="fork">Fork</button><button data-shape="fan">Fan</button><button data-shape="spindle">Spindle</button></div>
<label class="knob" for="reach"><span>Arm length</span><output id="reachValue"></output><input id="reach" type="range" min="0" max="100" step="1" value="80"></label>
<div class="ends"><span>Round</span><span>Fully extended</span></div><button id="sweep">Sweep arm length</button>
<h2>Surrounding tissue</h2>
<label class="knob" for="press"><span>Wall compression</span><output id="pressValue"></output><input id="press" type="range" min="0" max="95" step="1" value="36"></label>
<label class="knob" for="stretch"><span>Background elongation</span><output id="stretchValue"></output><input id="stretch" type="range" min="1" max="2.8" step=".05" value="1.35"></label>
<p id="limit"></p>
</section></div>
<section class="comparison"><div><h2>One cell, same target area</h2><label class="cellpick">Follow <select id="cell"><option value="7">upper left gold cell</option><option value="10">upper right gold cell</option><option value="21" selected>lower gold cell</option></select></label></div>
<figure><canvas id="before" width="160" height="100"></canvas><figcaption>Round control</figcaption></figure><figure><canvas id="after" width="160" height="100"></canvas><figcaption>Current shape</figcaption></figure>
<p id="result" aria-live="polite"></p></section>
<p class="footer"><a href="cycle.html" target="_top">Open the ten-type squeeze-and-release experiment →</a></p>
</main><script type="module" src="reach.mjs"></script></body></html>
